name: Fechar issues no merge em dev

# O branch padrão é master: `Closes #N` só fecha a issue quando o merge
# cai lá. Os PRs entram em dev, e as issues ficavam abertas até alguém
# fechar à mão (às vezes ninguém fechava). Este workflow faz isso.
#
# Issue da vistoria de UX (marcador <!-- vistoria: no corpo) NÃO fecha
# aqui: a vistoria mede PRODUÇÃO e fecha a issue sozinha depois de 2
# rodadas sem o problema. Ela só ganha um comentário dizendo que a
# correção já está em dev.
# Só valem as palavras de fechamento (closes/fixes/resolves). "Refs #N"
# (PR parcial) não fecha nada.

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      # Corpo via env (nunca interpolado no script): texto do PR não vira código.
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Fechar issues citadas com Closes/Fixes/Resolves
        run: |
          set -uo pipefail
          # Tira blocos ``` e trechos `entre crases` antes: exemplo citado
          # na descrição ("Closes #105" num "Como testei") não fecha nada.
          NUMS=$(printf '%s\n' "$BODY" \
            | sed '/^[[:space:]]*```/,/^[[:space:]]*```/d' \
            | sed 's/`[^`]*`//g' \
            | grep -oiE '(^|[^[:alnum:]/])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -un || true)
          [ -n "$NUMS" ] || { echo "Nenhuma issue com palavra de fechamento."; exit 0; }

          for N in $NUMS; do
            INFO=$(gh api "repos/$GH_REPO/issues/$N" 2>/dev/null) || { echo "::warning::#$N não encontrada."; continue; }
            if [ "$(jq -r '.pull_request != null' <<<"$INFO")" = "true" ]; then
              echo "#$N é PR, não issue — pulando."; continue
            fi
            if [ "$(jq -r .state <<<"$INFO")" != "open" ]; then
              echo "#$N já está fechada."; continue
            fi
            if jq -r '.body // ""' <<<"$INFO" | grep -q '<!-- vistoria:'; then
              gh issue comment "$N" --body "Correção em \`dev\` pelo PR #$PR. A vistoria fecha esta issue sozinha depois de 2 rodadas sem o problema em produção."
              echo "#$N é da vistoria — comentada, não fechada."
            else
              gh issue close "$N" --reason completed \
                --comment "Fechada pelo merge do PR #$PR em \`dev\` (o \`Closes\` só fecha sozinho no merge em master)."
              echo "#$N fechada."
            fi
          done

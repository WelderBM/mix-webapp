name: Fechar issues no merge em dev

# Fecha as issues citadas com Closes/Fixes/Resolves quando o PR entra em dev
# (o branch padrão).
#
# Por que não basta o fechamento nativo do GitHub: o merge automático do
# gate (claude-pr-review.yml) é feito com o GITHUB_TOKEN, e merge feito por
# esse token não fecha issue nem dispara outro workflow. Foi assim que a
# #342, a #320 e a #365 ficaram abertas com o trabalho já em dev.
# Por isso este workflow roda de três jeitos:
#   - pull_request closed: merge feito por uma pessoa;
#   - workflow_dispatch com o número do PR: o gate chama logo depois do merge;
#   - todo dia (reconciliação): confere os PRs mergeados em dev nos últimos
#     7 dias e fecha o que tiver escapado.
#
# Issue da vistoria de UX (marcador <!-- vistoria: no corpo) NÃO fecha
# aqui: a vistoria mede PRODUÇÃO e fecha a issue sozinha depois de 2
# rodadas sem o problema. Ela só ganha um comentário (uma vez) dizendo que
# a correção já está em dev.
# Só valem as palavras de fechamento (closes/fixes/resolves). "Refs #N"
# (PR parcial) não fecha nada.

on:
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      pr:
        description: "Número do PR mergeado em dev (vazio = reconciliar os últimos 7 dias)"
        required: false
  schedule:
    - cron: "17 10 * * *" # 07:17 em Brasília

permissions:
  issues: write
  pull-requests: read

# Um grupo por PR (e um para a reconciliação): merges seguidos do gate não
# cancelam um ao outro na fila (revisão do #385).
concurrency:
  group: close-issues-on-dev-${{ github.event.pull_request.number || inputs.pr || 'reconciliar' }}
  cancel-in-progress: false

jobs:
  close:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      EVENT_PR: ${{ github.event.pull_request.number }}
      INPUT_PR: ${{ inputs.pr }}
    steps:
      - name: Fechar issues citadas com Closes/Fixes/Resolves
        run: |
          set -uo pipefail

          # Números citados com palavra de fechamento. O corpo vem por arquivo
          # (nunca interpolado no script): texto do PR não vira código.
          # Tira blocos ``` e trechos `entre crases` antes: exemplo citado na
          # descrição ("Closes #105" num "Como testei") não fecha nada.
          closing_numbers() {
            sed '/^[[:space:]]*```/,/^[[:space:]]*```/d' "$1" \
              | sed 's/`[^`]*`//g' \
              | grep -oiE '(^|[^[:alnum:]/])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#[0-9]+' \
              | grep -oE '[0-9]+$' | sort -un || true
          }

          handle_pr() {
            local PR=$1
            local INFO
            INFO=$(gh pr view "$PR" --json state,baseRefName,body) || { echo "::warning::PR #$PR não encontrado."; return; }
            if [ "$(jq -r .state <<<"$INFO")" != "MERGED" ] || [ "$(jq -r .baseRefName <<<"$INFO")" != "dev" ]; then
              echo "PR #$PR não está mergeado em dev — pulando."; return
            fi
            jq -r '.body // ""' <<<"$INFO" > "$RUNNER_TEMP/body.txt"
            local N ISSUE
            for N in $(closing_numbers "$RUNNER_TEMP/body.txt"); do
              ISSUE=$(gh api "repos/$GH_REPO/issues/$N" 2>/dev/null) || { echo "::warning::#$N não encontrada."; continue; }
              if [ "$(jq -r '.pull_request != null' <<<"$ISSUE")" = "true" ]; then
                echo "#$N é PR, não issue — pulando."; continue
              fi
              if [ "$(jq -r .state <<<"$ISSUE")" != "open" ]; then
                echo "#$N já está fechada."; continue
              fi
              # Reaberta por alguém (correção incompleta): a decisão humana
              # vale; a reconciliação não fecha de novo (revisão do #385).
              REOPENED=$(gh api "repos/$GH_REPO/issues/$N/events" --paginate \
                --jq '[.[] | select(.event == "reopened")] | length' | awk '{s+=$1} END {print s+0}')
              if [ "$REOPENED" -gt 0 ]; then
                echo "#$N foi reaberta à mão — não fecho de novo."; continue
              fi
              if jq -r '.body // ""' <<<"$ISSUE" | grep -q '<!-- vistoria:'; then
                # Comenta uma vez só (a reconciliação diária passaria de novo).
                # Conta pelo jq (sem grep -q no pipe: com pipefail dava falso
                # negativo e o comentário se repetia).
                DONE=$(gh api "repos/$GH_REPO/issues/$N/comments" --paginate \
                  --jq "[.[] | select(.body | startswith(\"Correção em \`dev\` pelo PR #$PR.\"))] | length" \
                  | awk '{s+=$1} END {print s+0}')
                if [ "$DONE" -gt 0 ]; then
                  echo "#$N (vistoria) já comentada."
                else
                  gh issue comment "$N" --body "Correção em \`dev\` pelo PR #$PR. A vistoria fecha esta issue sozinha depois de 2 rodadas sem o problema em produção."
                  echo "#$N é da vistoria — comentada, não fechada."
                fi
              else
                gh issue close "$N" --reason completed \
                  --comment "Fechada pelo merge do PR #$PR em \`dev\`."
                echo "#$N fechada."
              fi
            done
          }

          PR="${EVENT_PR:-${INPUT_PR:-}}"
          if [ -n "$PR" ]; then
            handle_pr "$PR"
          else
            SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
            for P in $(gh pr list --base dev --state merged --search "merged:>=$SINCE" --limit 200 --json number --jq '.[].number'); do
              handle_pr "$P"
            done
          fi
